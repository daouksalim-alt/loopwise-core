name: Reproducible bug
description: Report a generation, answer-validation, or compatibility problem.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic seeds and examples. Do not include personal information, credentials, or clinical records."
  - type: input
    id: version
    attributes:
      label: Package version
      description: Include the commit if testing unreleased code.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version or browser name and version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Smallest reproduction
      description: Include game ID, index, synthetic seed, difficulty, and date when applicable.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and reasoning
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
